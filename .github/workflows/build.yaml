name: Build and publish application

on:
  push:

jobs:
  build-publish:
    name: Build, Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish backend
        run: |-
          docker build --tag "viksil/pingpong" ./apps/pingpong
          docker push "viksil/pingpong"
          docker build --tag "viksil/log_output" ./apps/log_output
          docker push "viksil/log_output"
          docker build --tag "viksil/log_output_reader" ./apps/log_output_reader
          docker push "viksil/log_output_reader"
  